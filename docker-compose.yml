# ============================================================================
# docker-compose.yml — 日常开发用（轻量构建）
#
# 依赖：需要先运行 docker-compose.base.yml 构建基础镜像并启动基础设施
#
# 用法：
#   # 首次/依赖变更时：
#   docker compose -f docker-compose.base.yml build base
#   docker compose -f docker-compose.base.yml up -d
#   # 日常：
#   docker compose up -d --build    # 只重建应用层（几秒）
# ============================================================================

# v4.1.5：统一 stdout 日志轮转（Docker 默认 json-file 不轮转，长跑会写满磁盘）
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  # ==========================================================================
  # 前端 + Nginx 反向代理
  # ==========================================================================
  frontend:
    logging: *default-logging  # v4.1.5 统一轮转，防写满磁盘
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ai-test-gen-web
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ai-test-gen-net
    restart: unless-stopped

  # ==========================================================================
  # 后端 API 服务（基于预构建基础镜像，只 COPY 代码）
  # ==========================================================================
  backend:
    logging: *default-logging  # v4.1.5 统一轮转，防写满磁盘
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        BASE_IMAGE: ai-test-gen-base:latest
    container_name: ai-test-gen-api
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      # 开发模式：挂载代码实现热重载（生产部署时注释掉）
      - ./backend:/app
      # bge 模型：独立挂载（/app 被覆盖后模型仍可访问）
      - ./models/bge-large-zh-v1.5:/models/bge-large-zh-v1.5:ro
      # bge-reranker-base 重排模型：独立挂载
      - ./models/bge-reranker-base:/models/bge-reranker-base:ro
      # 注：bge-small/base 去重专用模型（docs/27 A）经 C3 定标**否决**——
      #   换模型后 0.92 阈值无法迁移（small 过判 979 对/base 漏判 47%），
      #   详见 docs/27 附录 A。模型文件在 ./models/ 未删，代码入口
      #   embed_texts_for_dedup 保留（默认关闭），将来重启 A 路线需重跑定标。
    environment:
      - APP_PORT=8000
      - DEBUG=${DEBUG:-true}
      - DATABASE_URL=postgresql+asyncpg://aitestgen:aitestgen123@postgres:5432/ai_test_gen
      - VECTOR_STORE=milvus
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - EMBEDDING_MODEL_TYPE=local
      - EMBEDDING_MODEL_NAME=/models/bge-large-zh-v1.5
      - RERANKER_ENABLED=true
      - RERANKER_MODEL_NAME=/models/bge-reranker-base
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      # v4.1（缺陷 C）：语义去重 embed 并行进程池 worker 数。
      #   留空 = 串行（旧行为）；2 = 2 进程 × 4 线程（宿主 12 逻辑核 / 31.9GB，
      #   worker 各 ~1.6GB，实测余量充足）。dedup_semantic 已在 to_thread 内，
      #   进程池进一步把「单次 encode 35min」压到近半，且与出箱投递在 CPU 上交错。
      - DEDUP_EMBED_WORKERS=${DEDUP_EMBED_WORKERS:-2}
      # v4.1.5：celery 进程内去重进程池强制串行 —— 由运行时特征判定
      #   （milvus_store._in_celery_worker），**不注入环境变量**，避免污染测试进程。
      # v4.1.5（跨容器 CPU 预算投影）：api 与 celery 各自只读自己的 cgroup，
      #   小机器上会超卖。deploy.sh 把 celery 的 cpus 声明换算成逻辑核数注入这里，
      #   api 的并发预算按「自身 − 该值」算（resource_guard.effective_cpu_limit）。
      #   留空 = 未投影，只看自己（旧行为）。开发机通常不必设。
      - PEER_CELERY_CPU=${PEER_CELERY_CPU:-}
    # v4.1.5（OOM 保护依据）：不设上限则容器 cgroup 为 "max"，
    # 应用的 MEM_LOW_RATIO 守卫读不到容器上限 → 只能读宿主内存 → 保护失效。
    # 开发机默认留空（不限制，保持旧行为）；生产由 deploy.sh 按宿主内存自动写入。
    # 注意：mem_limit / cpus 都不接受空串（`invalid size: ''`），
    # 因此配额由 deploy.sh 生成的 docker-compose.resources.override.yml 注入，
    # 需要本地验收时：API_MEM_LIMIT=6g API_CPU_LIMIT=4 bash scripts/apply-resource-limits.sh
    command: >
      sh -c "
        if [ '${DEBUG:-true}' = 'true' ]; then
          uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload;
        else
          uvicorn app.main:app --host 0.0.0.0 --port 8000;
        fi
      "
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy
    networks:
      - ai-test-gen-net
    restart: unless-stopped

  # ==========================================================================
  # Celery Worker（异步嵌入计算 + 知识库双写）
  # ==========================================================================
  celery_worker:
    logging: *default-logging  # v4.1.5 统一轮转，防写满磁盘
    container_name: ai-test-gen-celery
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        BASE_IMAGE: ai-test-gen-base:latest
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      # 开发模式：挂载代码（与 backend 一致）
      - ./backend:/app
      # bge 模型：独立挂载（/app 被覆盖后模型仍可访问）
      - ./models/bge-large-zh-v1.5:/models/bge-large-zh-v1.5:ro
      - ./models/bge-reranker-base:/models/bge-reranker-base:ro
    environment:
      - DATABASE_URL=postgresql+asyncpg://aitestgen:aitestgen123@postgres:5432/ai_test_gen
      - VECTOR_STORE=milvus
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - EMBEDDING_MODEL_TYPE=local
      - EMBEDDING_MODEL_NAME=/models/bge-large-zh-v1.5
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=info --concurrency=2 --queues=embedding
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app.celery_app inspect ping -d celery@$$HOSTNAME --timeout=10 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy
    networks:
      - ai-test-gen-net
    restart: unless-stopped

  # ==========================================================================
  # PostgreSQL 16 + pgvector + zhparser（关系数据库 + BM25 中文全文检索）
  # ==========================================================================
  postgres:
    logging: *default-logging  # v4.1.5 统一轮转，防写满磁盘
    container_name: ai-test-gen-pg
    build:
      context: .
      dockerfile: docker/postgres.Dockerfile
    environment:
      POSTGRES_DB: ai_test_gen
      POSTGRES_USER: aitestgen
      POSTGRES_PASSWORD: ${PG_PASSWORD:-aitestgen123}
    ports:
      - "5432:5432"
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aitestgen -d ai_test_gen"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-test-gen-net
    restart: unless-stopped

  # ==========================================================================
  # Redis（L1 缓存 + Celery broker）
  # ==========================================================================
  redis:
    logging: *default-logging  # v4.1.5 统一轮转，防写满磁盘
    container_name: ai-test-gen-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    # v4.1.5：淘汰策略从 allkeys-lru 改为 noeviction。
    # 原因（实测）：同一实例同时承担 KB 缓存、Celery broker(1 号库)、result backend(2 号库)。
    # allkeys-lru 会**无差别淘汰**——包括 Celery 队列里还没被消费的任务消息；
    # 消息被淘汰后 send_task 这种 fire-and-forget 调用不会报错，
    # vectorization_status 会永久停在 pending（静默丢数据，比写失败更危险）。
    # noeviction 下写满会报错，但缓存侧已 try/except 降级（kb_cache.py:170 只记 debug），
    # 主流程不受影响；任务消息宁可写入失败也不该被静默丢弃。
    # 若后续把 broker 拆到独立实例，可再考虑把缓存库改回 volatile-lru。
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-test-gen-net
    restart: unless-stopped

  # ==========================================================================
  # 基础设施（从 base compose 引用，仅声明网络接入）
  # 这些服务的实际定义在 docker-compose.base.yml 中
  # ==========================================================================
  etcd:
    logging: *default-logging  # v4.1.5 统一轮转，防写满磁盘
    container_name: ai-test-gen-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./milvus/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - ai-test-gen-net
    restart: unless-stopped

  minio:
    logging: *default-logging  # v4.1.5 统一轮转，防写满磁盘
    container_name: ai-test-gen-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9001:9001"
    volumes:
      - ./milvus/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - ai-test-gen-net
    restart: unless-stopped

  milvus:
    logging: *default-logging  # v4.1.5 统一轮转，防写满磁盘
    container_name: ai-test-gen-milvus
    image: milvusdb/milvus:v2.4.0
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    # v4.1.5：Milvus mmap 锁页需要放开 memlock（3.x 内核默认仅 64KB 会崩）
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      memlock:
        soft: -1
        hard: -1
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - ./milvus/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 60s
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - ai-test-gen-net
    restart: unless-stopped

networks:
  ai-test-gen-net:
    driver: bridge
