<style>
/* ═══════════════════════════════════════════════════════════════
   Shared Project Shell — Apple Design Library (dl_builtin_apple)
   All colors/typography/radius/shadows via CSS variables
   from colors_and_type.css — no hardcoded values
   Note: var(--muted) is the semantic alias for --background-200 (#f2f2f7)
   ═══════════════════════════════════════════════════════════════ */

/* ── App Shell Root ── */
.app-shell {
  display: flex;
  height: 100vh;
  overflow: hidden;
  font-family: var(--font-sans);
  color: var(--foreground);
  background: var(--background);
}

/* ── Sidebar (240px fixed) ── */
.sidebar {
  width: 240px;
  flex-shrink: 0;
  background: var(--sidebar);
  border-right: 1px solid var(--sidebar-border);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}

.sidebar-header {
  display: flex;
  align-items: center;
  gap: 10px;
  height: 64px;
  padding: 0 16px;
  flex-shrink: 0;
}

.sidebar-logo-icon {
  width: 22px;
  height: 22px;
  color: var(--primary);
  flex-shrink: 0;
}

.sidebar-logo-text {
  font-size: 15px;
  font-weight: 600;
  color: var(--sidebar-foreground);
  white-space: nowrap;
  letter-spacing: -0.01em;
}

/* ── Sidebar Navigation ── */
.sidebar-nav {
  flex: 1;
  padding: 8px 12px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  height: 40px;
  padding: 0 12px;
  border-radius: calc(var(--radius) * 0.5);
  color: var(--sidebar-foreground);
  text-decoration: none;
  font-size: 13px;
  font-weight: 400;
  white-space: nowrap;
  transition: background-color 0.18s ease, color 0.18s ease;
}

.nav-item svg {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
}

.nav-item:hover {
  background: var(--sidebar-accent);
  color: var(--sidebar-accent-foreground);
}

.nav-item[data-active="true"] {
  background: var(--sidebar-primary);
  color: var(--sidebar-primary-foreground);
  font-weight: 500;
}

.nav-item[data-active="true"]:hover {
  background: var(--sidebar-primary);
  color: var(--sidebar-primary-foreground);
}

/* ── Main Area ── */
.main-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}

/* ── Top Header (64px fixed) ── */
.top-header {
  height: 64px;
  flex-shrink: 0;
  background: var(--background);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 32px;
  gap: 16px;
}

/* ── Search Box ── */
.search-box {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 40px;
  padding: 0 12px;
  border: 1px solid var(--input);
  border-radius: calc(var(--radius) * 0.6);
  background: var(--background);
  flex: 1;
  max-width: 480px;
  transition: border-color 0.18s ease, box-shadow 0.18s ease;
}

.search-box:focus-within {
  border-color: var(--ring);
  box-shadow: 0 0 0 1px var(--ring);
}

.search-box svg {
  width: 16px;
  height: 16px;
  color: var(--muted-foreground);
  flex-shrink: 0;
}

.search-box input {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--foreground);
  font-family: var(--font-sans);
  font-size: 13px;
}

.search-box input::placeholder {
  color: var(--muted-foreground);
}

/* ── Header Actions ── */
.header-actions {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-left: auto;
  flex-shrink: 0;
}

/* ── Notification Button ── */
.notification-btn {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  border: 0;
  border-radius: calc(var(--radius) * 0.5);
  background: transparent;
  color: var(--foreground);
  cursor: pointer;
  transition: background-color 0.18s ease;
}

.notification-btn:hover {
  background: var(--accent);
}

.notification-btn svg {
  width: 20px;
  height: 20px;
}

.notification-dot {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--destructive);
  border: 2px solid var(--background);
}

/* ── User Area ── */
.user-area {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  padding: 4px 8px 4px 4px;
  border-radius: calc(var(--radius) * 0.5);
  transition: background-color 0.18s ease;
}

.user-area:hover {
  background: var(--accent);
}

.user-avatar {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--primary);
  color: var(--primary-foreground);
  font-size: 13px;
  font-weight: 600;
  flex-shrink: 0;
}

.user-name {
  font-size: 13px;
  color: var(--foreground);
  white-space: nowrap;
}

.user-area svg {
  width: 16px;
  height: 16px;
  color: var(--muted-foreground);
  flex-shrink: 0;
}

/* ── Content Wrapper ── */
.content-wrapper {
  flex: 1;
  overflow-y: auto;
  background: var(--muted);
  padding: 32px;
  min-height: 0;
}

/* ── Page Title Slot ── */
.page-title-bar {
  margin-bottom: 24px;
}

.page-title {
  margin: 0;
  font-size: 28px;
  font-weight: 600;
  color: var(--foreground);
  line-height: 1.2;
  letter-spacing: -0.02em;
}

/* ── Page Content Slot ── */
.page-content {
  min-height: 0;
}
</style>

<div class="app-shell">
  <!-- 侧边栏 -->
  <aside class="sidebar" data-region="sidebar">
    <!-- Logo 区域 -->
    <div class="sidebar-header">
      <i data-lucide="sparkles" class="sidebar-logo-icon"></i>
      <span class="sidebar-logo-text">AI测试生成</span>
    </div>
    <!-- 导航列表 -->
    <nav class="sidebar-nav" aria-label="主导航">
      <a class="nav-item" data-nav-key="dashboard" data-dom-id="nav-dashboard" data-active="false" href="#">
        <i data-lucide="layout-dashboard"></i>
        <span>仪表盘</span>
      </a>
      <a class="nav-item" data-nav-key="requirements" data-dom-id="nav-requirements" data-active="false" href="#">
        <i data-lucide="file-text"></i>
        <span>需求管理</span>
      </a>
      <a class="nav-item" data-nav-key="test-cases" data-active="false" href="#">
        <i data-lucide="check-square"></i>
        <span>测试用例</span>
      </a>
      <a class="nav-item" data-nav-key="knowledge-base" data-active="false" href="#">
        <i data-lucide="book-open"></i>
        <span>知识库</span>
      </a>
      <a class="nav-item" data-nav-key="dependency-graph" data-active="false" href="#">
        <i data-lucide="git-branch"></i>
        <span>依赖图谱</span>
      </a>
      <a class="nav-item" data-nav-key="knowledge-qa" data-active="false" href="#">
        <i data-lucide="message-circle"></i>
        <span>知识问答</span>
      </a>
      <a class="nav-item" data-nav-key="project-management" data-active="false" href="#">
        <i data-lucide="folder-kanban"></i>
        <span>项目管理</span>
      </a>
      <a class="nav-item" data-nav-key="settings" data-active="false" href="#">
        <i data-lucide="settings"></i>
        <span>设置</span>
      </a>
    </nav>
  </aside>

  <!-- 主区域 -->
  <div class="main-area">
    <!-- 顶栏 -->
    <header class="top-header" data-region="top-header">
      <!-- 搜索框 -->
      <div class="search-box">
        <i data-lucide="search"></i>
        <input type="text" placeholder="搜索需求、用例..." aria-label="搜索需求、用例">
      </div>
      <!-- 顶栏操作区 -->
      <div class="header-actions">
        <!-- 通知铃铛 -->
        <button class="notification-btn" type="button" aria-label="通知">
          <i data-lucide="bell"></i>
          <span class="notification-dot" aria-hidden="true"></span>
        </button>
        <!-- 用户区域 -->
        <div class="user-area">
          <div class="user-avatar">测</div>
          <span class="user-name">测试工程师</span>
          <i data-lucide="chevron-down"></i>
        </div>
      </div>
    </header>

    <!-- 内容容器 -->
    <main class="content-wrapper" data-region="content-wrapper">
      <!-- 页面标题插槽 -->
      <div class="page-title-bar" data-slot="pageTitle">
        <h1 class="page-title">页面标题</h1>
      </div>
      <!-- 页面内容插入点 -->
      <div class="page-content" data-slot="pageContent">
        <!-- 叶子页面内容将在此处插入 -->
      </div>
    </main>
  </div>
</div>
