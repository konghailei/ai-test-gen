name: CI

# AI-Test-Gen 最小 CI 配置
# 对应架构文档 docs/05 §12 实施建议 + docs/11 §7.3 后续演进方向
# 触发：push 到主分支 + 所有 PR
# 验证内容：后端语法 + pytest 单元测试 + 前端 TypeScript 构建

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend-test:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Syntax check (py_compile)
        run: |
          python -m compileall -q app/
          echo "✅ 所有 backend/app/ Python 文件语法检查通过"

      # v3.4（docs/15 §4.5 / P0-4）：pytest 失败必须阻断。
      # 原先此处 `continue-on-error: true`，等于"测试永不红灯"——形同没有测试门禁。
      # 现在跑的是 unit 层：只收集无外部依赖的用例（tests/conftest.py 里对脚本式
      # 集成用例 test_phaseN_*.py 等做了 collect_ignore），因此无需 PG/Redis 也能跑。
      # 集成层（脚本式套件）需真实服务，本地用 AITG_RUN_INTEGRATION=1 启用；
      # 待迁成标准 pytest + service containers 后再纳入 CI（见 docs/15 §4.5 剩余项）。
      - name: Run unit tests (pytest, 失败即红灯)
        run: |
          cd .. && python -m pytest backend/tests -q

  frontend-build:
    name: Frontend (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check + Vite build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
