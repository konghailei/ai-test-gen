# AI-Test-Gen — AI 驱动测试用例自动生成系统
#
# 设计依据：
# - docs/05-technical-selection.md（全栈技术选型）
# - docs/00-architecture-overview.md（系统架构）
#
# 安装方式：
#   pip install -e .                    # 安装为可编辑包
#   pip install -e ".[dev]"            # 含开发依赖
#   pip install -e ".[production]"     # 含生产依赖（PostgreSQL/Redis）

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "ai-test-gen"
version = "1.0.0"
description = "AI 驱动测试用例自动生成系统"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "AI-Test-Gen Team" },
]
keywords = ["test", "ai", "llm", "testing", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]

# 核心依赖（MVP 必需）
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.0.0",
    "litellm>=1.50.0",
    "langgraph>=0.2.0",
    "chromadb>=0.5.0",
    "numpy>=1.26.0,<2.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx<0.28.0",
    "loguru>=0.7.0",
    "python-dotenv>=1.0.0",
    "tenacity>=9.0.0",
    "cryptography>=43.0.0",
]

[project.optional-dependencies]
# 开发依赖
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

# 生产依赖（PostgreSQL + Redis + 可观测性）
production = [
    "psycopg[binary]>=3.2.0",
    "asyncpg>=0.29.0",
    "redis>=5.0",
    "celery[redis]>=5.4.0",
    "langfuse>=2.50.0",
    "prometheus-fastapi-instrumentator>=7.0",
]

# 嵌入模型依赖（本地部署 bge-large-zh-v1.5）
embedding = [
    "sentence-transformers>=3.0.0",
    "torch>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/example/ai-test-gen"
Documentation = "https://github.com/example/ai-test-gen/docs"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]  # 行长度由 formatter 处理

[tool.ruff.format]
quote-style = "double"
