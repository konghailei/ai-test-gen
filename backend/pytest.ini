[pytest]
# 容器内 /app 只有 backend/ 的内容（Dockerfile: `COPY backend/ .`），没有仓库根的
# pyproject.toml —— 于是 [tool.pytest.ini_options] 的 asyncio_mode 不生效：
# 20 个 async 测试会整批报 "async def functions are not natively supported"，
# 极易被误判成「测试挂了」而实际只是跑法缺参数。
#
# 这份配置随 COPY 一起进镜像，宿主机与容器两种跑法都可以直接 `pytest`，
# 不再需要 `-o asyncio_mode=auto`。
asyncio_mode = auto
testpaths = tests
# rootdir 落在 backend/（宿主机）或 /app（容器）时都能 import app.*
pythonpath = .
